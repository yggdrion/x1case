<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" width="1400" height="1090" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1342f"/>
    </marker>
    <style>
      .dim { stroke:#d1342f; stroke-width:2; marker-start:url(#a); marker-end:url(#a); }
      .ext { stroke:#d1342f; stroke-width:1; stroke-dasharray:4 3; }
      .ttl { font-size:20px; font-weight:bold; fill:#222; }
      .note { font-size:14px; fill:#444; }
      .lbl { font-size:13px; fill:#333; }
      .b circle { fill:#d1342f; }
      .b text { fill:#fff; font-size:13px; font-weight:bold; text-anchor:middle; dominant-baseline:central; }
    </style>
  </defs>
  <rect width="1400" height="1090" fill="#ffffff"/>

  <!-- ============ A: panel front ============ -->
  <text x="40" y="45" class="ttl">A  Display lid, front (hinges removed)</text>
  <rect x="80" y="100" width="520" height="300" fill="#dfe6ec" stroke="#333" stroke-width="2"/>
  <rect x="98" y="122" width="484" height="230" fill="#a9cbe8" stroke="#333"/>
  <text x="340" y="215" class="note" text-anchor="middle">lit pixels (active area)</text>
  <text x="340" y="235" class="note" text-anchor="middle">3–6 = lid outer edge to first lit pixel</text>
  <path d="M80,124 A24,24 0 0 1 104,100" fill="none" stroke="#d1342f" stroke-width="2"/>
  <g class="b"><circle cx="116" cy="112" r="11"/><text x="116" y="112">R</text></g>
  <!-- 1 width -->
  <line x1="80" y1="98" x2="80" y2="70" class="ext"/><line x1="600" y1="98" x2="600" y2="70" class="ext"/>
  <line x1="80" y1="78" x2="600" y2="78" class="dim"/>
  <g class="b"><circle cx="340" cy="78" r="13"/><text x="340" y="78">1</text></g>
  <!-- 2 height -->
  <line x1="78" y1="100" x2="50" y2="100" class="ext"/><line x1="78" y1="400" x2="50" y2="400" class="ext"/>
  <line x1="58" y1="100" x2="58" y2="400" class="dim"/>
  <g class="b"><circle cx="58" cy="250" r="13"/><text x="58" y="250">2</text></g>
  <!-- 3 left border -->
  <line x1="80" y1="290" x2="98" y2="290" class="dim"/>
  <g class="b"><circle cx="122" cy="290" r="13"/><text x="122" y="290">3</text></g>
  <!-- 4 right border -->
  <line x1="582" y1="290" x2="600" y2="290" class="dim"/>
  <g class="b"><circle cx="558" cy="290" r="13"/><text x="558" y="290">4</text></g>
  <!-- 5 top border -->
  <line x1="200" y1="100" x2="200" y2="122" class="dim"/>
  <g class="b"><circle cx="224" cy="140" r="13"/><text x="224" y="140">5</text></g>
  <!-- 6 bottom border -->
  <line x1="200" y1="352" x2="200" y2="400" class="dim"/>
  <g class="b"><circle cx="224" cy="376" r="13"/><text x="224" y="376">6</text></g>

  <!-- ============ B: lid bottom edge ============ -->
  <text x="40" y="465" class="ttl">B  Lid, bottom area (seen from the front)</text>
  <rect x="80" y="485" width="520" height="190" fill="#dfe6ec" stroke="#333" stroke-width="2"/>
  <text x="340" y="540" class="note" text-anchor="middle">old hinge screw holes + where the cables come out</text>
  <circle cx="80" cy="675" r="6" fill="#222"/>
  <text x="40" y="700" class="lbl">lid corner ● (bottom-left, front view)</text>
  <g fill="#fff" stroke="#333" stroke-width="2"><circle cx="130" cy="645" r="6"/><circle cx="160" cy="645" r="6"/><circle cx="520" cy="645" r="6"/><circle cx="550" cy="645" r="6"/></g>
  <!-- 8 hole x -->
  <line x1="80" y1="625" x2="124" y2="625" class="dim"/>
  <g class="b"><circle cx="102" cy="608" r="13"/><text x="102" y="608">8</text></g>
  <!-- 9 hole y -->
  <line x1="130" y1="651" x2="130" y2="675" class="dim"/>
  <g class="b"><circle cx="110" cy="663" r="11"/><text x="110" y="663">9</text></g>
  <text x="180" y="630" class="lbl">every hole: x (8) + y (9) + diameter</text>
  <!-- cable bundle -->
  <rect x="300" y="675" width="90" height="40" fill="#e0a64a" stroke="#333"/>
  <text x="400" y="700" class="lbl">cable bundle (eDP, touch,</text>
  <text x="400" y="716" class="lbl">webcam, Wi-Fi)</text>
  <line x1="80" y1="682" x2="80" y2="745" class="ext"/><line x1="300" y1="717" x2="300" y2="745" class="ext"/><line x1="390" y1="717" x2="390" y2="745" class="ext"/>
  <line x1="80" y1="740" x2="300" y2="740" class="dim"/>
  <line x1="300" y1="740" x2="390" y2="740" class="dim"/>
  <g class="b"><circle cx="190" cy="740" r="13"/><text x="190" y="740">10</text></g>
  <text x="400" y="745" class="lbl">start x + width (may be at a corner)</text>

  <!-- ============ C: lid edge ============ -->
  <text x="40" y="800" class="ttl">C  Lid, edge view</text>
  <text x="80" y="828" class="lbl">front (glass) ↑</text>
  <rect x="80" y="840" width="520" height="18" rx="4" fill="#a9cbe8" stroke="#333" stroke-width="2"/>
  <text x="80" y="885" class="lbl">thickest point, glass to back cover (lid closed flat on a table)</text>
  <!-- 7 thickness -->
  <line x1="602" y1="840" x2="640" y2="840" class="ext"/><line x1="602" y1="858" x2="640" y2="858" class="ext"/>
  <line x1="630" y1="840" x2="630" y2="858" class="dim"/>
  <g class="b"><circle cx="658" cy="849" r="13"/><text x="658" y="849">7</text></g>

  <!-- 30 edge thickness -->
  <line x1="80" y1="840" x2="80" y2="812" class="ext"/>
  <line x1="92" y1="840" x2="92" y2="858" class="dim"/>
  <g class="b"><circle cx="120" cy="905" r="13"/><text x="120" y="905">30</text></g>
  <text x="142" y="910" class="lbl">thickness 3 mm in from the edge, all 4 sides (the clamp grips here)</text>

  <!-- ============ H: lid extras ============ -->
  <text x="40" y="960" class="ttl">H  Lid extras</text>
  <g class="b"><circle cx="53" cy="990" r="13"/><text x="53" y="990">31</text></g>
  <text x="75" y="995" class="note">old hinge screw holes: thread size (M2 / M2.5), metal insert or plastic</text>
  <g class="b"><circle cx="53" cy="1022" r="13"/><text x="53" y="1022">32</text></g>
  <text x="75" y="1027" class="note">hinge stubs on the bottom edge: unscrew them if they come off without force.</text>
  <text x="75" y="1047" class="note">If they stay: x from the lid corner, width, how far they stick out past the back cover.</text>
  <text x="75" y="1067" class="note">Same for anything else sticking out of the outline.</text>

  <!-- ============ D: board top view ============ -->
  <text x="720" y="45" class="ttl">D  Mainboard, heatsink side up</text>
  <text x="720" y="68" class="note">port edges left + right, measure everything from 0,0</text>
  <rect x="760" y="100" width="560" height="220" fill="#cfe8cf" stroke="#333" stroke-width="2"/>
  <rect x="1000" y="170" width="200" height="110" fill="#efbf8a" stroke="#333"/>
  <text x="1100" y="222" class="lbl" text-anchor="middle">heatsink</text>
  <text x="1100" y="239" class="lbl" text-anchor="middle">+ blowers</text>
  <rect x="1225" y="185" width="65" height="70" fill="#b8c7e0" stroke="#333"/>
  <text x="1257" y="224" class="lbl" text-anchor="middle">RAM</text>
  <!-- ports -->
  <g fill="#666"><rect x="750" y="130" width="10" height="16"/><rect x="750" y="158" width="10" height="12"/><rect x="750" y="182" width="10" height="12"/><rect x="750" y="206" width="10" height="20"/><rect x="1320" y="130" width="10" height="20"/><rect x="1320" y="162" width="10" height="20"/><rect x="1320" y="196" width="10" height="30"/></g>
  <!-- holes -->
  <g fill="#fff" stroke="#333" stroke-width="2"><circle cx="776" cy="116" r="6"/><circle cx="1304" cy="116" r="6"/><circle cx="776" cy="304" r="6"/><circle cx="1304" cy="304" r="6"/><circle cx="900" cy="150" r="6"/></g>
  <g class="lbl"><text x="786" y="130">H1</text><text x="1270" y="130">H2</text><text x="786" y="298">H3</text><text x="1270" y="298">H4</text><text x="910" y="145">H5</text></g>
  <circle cx="760" cy="320" r="6" fill="#222"/>
  <text x="752" y="342" class="lbl" text-anchor="end">0,0</text>
  <!-- 11 width -->
  <line x1="760" y1="322" x2="760" y2="360" class="ext"/><line x1="1320" y1="322" x2="1320" y2="360" class="ext"/>
  <line x1="760" y1="352" x2="1320" y2="352" class="dim"/>
  <g class="b"><circle cx="1040" cy="352" r="13"/><text x="1040" y="352">11</text></g>
  <!-- 12 height -->
  <line x1="745" y1="100" x2="715" y2="100" class="ext"/>
  <line x1="722" y1="100" x2="722" y2="320" class="dim"/>
  <g class="b"><circle cx="722" cy="290" r="13"/><text x="722" y="290">12</text></g>
  <!-- 13/14 hole x,y (H5 as example) -->
  <line x1="760" y1="150" x2="894" y2="150" class="dim"/>
  <g class="b"><circle cx="830" cy="150" r="13"/><text x="830" y="150">13</text></g>
  <line x1="900" y1="156" x2="900" y2="320" class="dim"/>
  <g class="b"><circle cx="900" cy="215" r="13"/><text x="900" y="215">14</text></g>
  <!-- 15/16 heatsink position -->
  <line x1="1000" y1="282" x2="1000" y2="300" class="ext"/>
  <line x1="906" y1="295" x2="1000" y2="295" class="dim"/>
  <g class="b"><circle cx="955" cy="295" r="13"/><text x="955" y="295">15</text></g>
  <line x1="1150" y1="280" x2="1150" y2="320" class="dim"/>
  <g class="b"><circle cx="1172" cy="300" r="13"/><text x="1172" y="300">16</text></g>
  <!-- 17/18 heatsink size -->
  <line x1="1000" y1="160" x2="1200" y2="160" class="dim"/>
  <g class="b"><circle cx="1100" cy="160" r="13"/><text x="1100" y="160">17</text></g>
  <line x1="1212" y1="170" x2="1212" y2="280" class="dim"/>
  <g class="b"><circle cx="1212" cy="268" r="13"/><text x="1212" y="268">18</text></g>

  <!-- ============ E: board side view ============ -->
  <text x="720" y="405" class="ttl">E  Mainboard, side view</text>
  <text x="1335" y="428" class="lbl" text-anchor="end">heatsink side ↑ (faces back)</text>
  <text x="1335" y="545" class="lbl" text-anchor="end">screen side ↓ (faces panel)</text>
  <rect x="760" y="500" width="560" height="8" fill="#4f9a4f" stroke="#333"/>
  <rect x="1000" y="440" width="200" height="60" fill="#efbf8a" stroke="#333"/>
  <rect x="1225" y="476" width="65" height="24" fill="#b8c7e0" stroke="#333"/>
  <rect x="850" y="508" width="60" height="16" fill="#9a9a9a" stroke="#333"/>
  <!-- 19 heatsink height -->
  <line x1="985" y1="440" x2="985" y2="500" class="dim"/>
  <g class="b"><circle cx="962" cy="470" r="13"/><text x="962" y="470">19</text></g>
  <!-- 20 tallest other part on heatsink side -->
  <line x1="1300" y1="476" x2="1300" y2="500" class="dim"/>
  <g class="b"><circle cx="1325" cy="488" r="13"/><text x="1325" y="488">20</text></g>
  <!-- 21 tallest part screen side -->
  <line x1="925" y1="508" x2="925" y2="524" class="dim"/>
  <g class="b"><circle cx="948" cy="520" r="13"/><text x="948" y="520">21</text></g>
  <!-- 22 board thickness -->
  <line x1="745" y1="500" x2="745" y2="508" class="dim"/>
  <g class="b"><circle cx="722" cy="504" r="13"/><text x="722" y="504">22</text></g>

  <!-- ============ F: power port ============ -->
  <text x="720" y="590" class="ttl">F  Power port (DC-in), the only port used</text>
  <text x="780" y="620" class="lbl">looking straight at the board edge with the DC-in</text>
  <rect x="780" y="720" width="260" height="8" fill="#4f9a4f" stroke="#333"/>
  <rect x="870" y="684" width="50" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="780" y="750" class="lbl">board corner (bottom edge, as in D)</text>
  <!-- 23 from corner -->
  <line x1="780" y1="728" x2="780" y2="790" class="ext"/><line x1="895" y1="712" x2="895" y2="790" class="ext"/>
  <line x1="780" y1="782" x2="895" y2="782" class="dim"/>
  <g class="b"><circle cx="838" cy="782" r="13"/><text x="838" y="782">23</text></g>
  <text x="905" y="800" class="lbl">to port centre</text>
  <!-- 26 centre height above board -->
  <line x1="845" y1="697" x2="868" y2="697" class="ext"/>
  <line x1="850" y1="697" x2="850" y2="720" class="dim"/>
  <g class="b"><circle cx="828" cy="700" r="13"/><text x="828" y="700">26</text></g>
  <text x="1080" y="660" class="note">+ which edge (left / right in D)</text>
  <text x="1080" y="690" class="note">+ which side it sits on</text>
  <text x="1080" y="710" class="note">   (heatsink side or screen side)</text>
  <g class="b"><circle cx="1093" cy="745" r="13"/><text x="1093" y="745">27</text></g>
  <text x="1115" y="750" class="note">plug length incl. strain relief</text>

  <!-- ============ G: cables ============ -->
  <text x="720" y="850" class="ttl">G  Cables</text>
  <g class="b"><circle cx="733" cy="880" r="13"/><text x="733" y="880">28</text></g>
  <text x="755" y="885" class="note">eDP cable length, connector to connector (laid flat, not stretched)</text>
  <g class="b"><circle cx="733" cy="912" r="13"/><text x="733" y="912">29</text></g>
  <text x="755" y="917" class="note">Wi-Fi antenna cable lengths, from the M.2 card</text>
</svg>
